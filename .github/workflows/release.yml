name: Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag da versao (ex: v1.0.0-beta)'
        required: true
        default: 'v1.0.0-beta'
      prerelease:
        description: 'Marcar como Pre-release (Beta)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install binary_reader Pillow numpy

      - name: Montar pacote de release
        run: |
          python tools/release/build_release_package.py

      - name: Compactar pacotes em ZIP
        id: package
        shell: pwsh
        run: |
          $sourceDir = "release/No_More_Heroes_2_Traducao_PTBR_Beta"
          $zipName = "No_More_Heroes_2_Traducao_PTBR_Beta.zip"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          Write-Host "Arquivo criado: $zipName"
          Write-Host "SHA256: $hash"

          $updateDir = "release/No_More_Heroes_2_Traducao_PTBR_Update"
          $zipUpdate = "No_More_Heroes_2_Traducao_PTBR_Update.zip"
          Compress-Archive -Path "$updateDir\*" -DestinationPath $zipUpdate -Force
          $hashUp = (Get-FileHash $zipUpdate -Algorithm SHA256).Hash
          Write-Host "Arquivo criado: $zipUpdate"
          Write-Host "SHA256: $hashUp"

      - name: Definir tag da release
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: No More Heroes 2 - Traducao PT-BR (${{ steps.vars.outputs.tag }})
          body_path: release/No_More_Heroes_2_Traducao_PTBR_Beta/LEIA-ME.txt
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          files: |
            No_More_Heroes_2_Traducao_PTBR_Beta.zip
            No_More_Heroes_2_Traducao_PTBR_Update.zip

